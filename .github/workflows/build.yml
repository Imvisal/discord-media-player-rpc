name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Tag eka (v1.6.0) exe eke version eka widiyata damanawa. Installed apps meka use karala update balanawa.
      - name: Set app version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > app_version.py
          else
            echo "__version__ = \"0.0.0-dev\"" > app_version.py
          fi
          cat app_version.py

      - name: Generate app icon
        run: python app_icon.py

      - name: Build exe
        run: pyinstaller --onefile --noconsole --icon icon.ico --hidden-import pystray._win32 --name MediaRPC media_rpc.py

      # Updater eka download karana exe eka verify karanne meken
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/MediaRPC.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MediaRPC.exe" | Out-File -FilePath dist/MediaRPC.exe.sha256 -Encoding ascii
          Get-Content dist/MediaRPC.exe.sha256

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaRPC
          path: |
            dist/MediaRPC.exe
            dist/MediaRPC.exe.sha256

      - name: Attach exe to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MediaRPC.exe
            dist/MediaRPC.exe.sha256
